services:
  qoder2api:
    image: ghcr.io/echoping07/qoder-2api-go:latest
    platform: linux/amd64
    container_name: qoder2api
    restart: unless-stopped
    ports:
      - "2323:10081"
    environment:
      QODER_DATA_PATH: /app/data/data.json
      QODER_ADMIN_PASSWORD: ${QODER_ADMIN_PASSWORD} # 实际值见同目录 .env（不入库）
      TZ: Asia/Shanghai
    volumes:
      - qoder2api-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:10081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qoder2api-2:
    image: ghcr.io/echoping07/qoder-2api-go:latest
    platform: linux/amd64
    container_name: qoder2api-2
    restart: unless-stopped
    ports:
      - "2324:10081"
    environment:
      QODER_DATA_PATH: /app/data/data.json
      QODER_ADMIN_PASSWORD: ${QODER_ADMIN_PASSWORD} # 实际值见同目录 .env（不入库）
      TZ: Asia/Shanghai
    volumes:
      - qoder2api-2-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:10081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qoder2api-data:
    name: qoder2api_qoder2api-data
    external: true
  qoder2api-2-data:
    name: qoder2api_qoder2api-2-data
    external: true
